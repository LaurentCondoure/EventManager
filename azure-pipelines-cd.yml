trigger: none  # manual trigger only — see documents/Technical/PIPELINE_WORKFLOW.md

resources:
  pipelines:
  - pipeline: backend-ci
    source: azure-pipelines-backend
    branch: main
    trigger: false  # not automatic — operator triggers CD after both CIs are green
  - pipeline: frontend-ci
    source: azure-pipelines-frontend
    branch: main
    trigger: false  # not automatic — operator triggers CD after both CIs are green

pool:
  name: Default

variables:
  terraformDirectory: terraform/azure
  azureServiceConnection: sc-eventmanager-prod
  appServiceName: app-eventmanagement-prod

stages:

# ── Infrastructure ────────────────────────────────────────────────────────────
# Applies the Terraform plan produced by azure-pipelines-terraform.yml.
# Gated by a manual approval on the "production" environment in Azure DevOps
# (Environments → production → Approvals and checks → Add → Approvals).

- stage: Infrastructure
  displayName: Terraform Apply
  jobs:

  - deployment: Apply
    displayName: terraform apply
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:

          - script: terraform init -input=false
            displayName: terraform init
            workingDirectory: $(terraformDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: |
              terraform apply -input=false -auto-approve \
                -var="sql_admin_username=$(SQL_ADMIN_USERNAME)" \
                -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" \
                -var="storage_name=$(STORAGE_NAME)"
            displayName: terraform apply
            workingDirectory: $(terraformDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              SQL_ADMIN_USERNAME: $(SQL_ADMIN_USERNAME)
              SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)
              STORAGE_NAME: $(STORAGE_NAME)

# ── Deploy API ────────────────────────────────────────────────────────────────

- stage: DeployApi
  displayName: Deploy API
  dependsOn: Infrastructure
  condition: succeeded()
  jobs:

  - deployment: DeployApi
    displayName: Deploy to App Service
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@1
            displayName: Download API artifact
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              pipeline: azure-pipelines-backend
              artifactName: api
              downloadPath: $(Pipeline.Workspace)

          - task: AzureWebApp@1
            displayName: Deploy to App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(appServiceName)
              package: $(Pipeline.Workspace)/api/**/*.zip

# ── Deploy Frontend ───────────────────────────────────────────────────────────
# Requires an Azure Static Web App resource provisioned in Terraform.
# The deployment token is available in the Static Web App resource → Manage deployment token.
# Add it as a secret variable AZURE_STATIC_WEB_APPS_API_TOKEN in the variable group.

- stage: DeployFrontend
  displayName: Deploy Frontend
  dependsOn: Infrastructure
  condition: succeeded()
  jobs:

  - deployment: DeployFrontend
    displayName: Deploy to Static Web App
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@1
            displayName: Download frontend artifact
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              pipeline: azure-pipelines-frontend
              artifactName: ui
              downloadPath: $(Pipeline.Workspace)

          - task: AzureStaticWebApp@0
            displayName: Deploy to Static Web App
            inputs:
              app_location: $(Pipeline.Workspace)/ui
              skip_app_build: true
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
